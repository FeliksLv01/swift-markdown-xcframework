name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - run: brew install xcbeautify cocoapods
      - run: ./Scripts/test-patch.sh
      - run: ./Scripts/test-source.sh
      - run: ./Scripts/test-release-scripts.sh
      - run: ./Scripts/build-xcframework.sh
      - run: ./Scripts/test-swiftpm.sh
      - run: ./Scripts/test-cocoapods.sh
